name: build & deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖（全部在仓库 node_modules）
        run: npm ci

      - name: 打包扩展
        run: node extension/esbuild.mjs

      - name: 扩展冒烟测试
        run: |
          node extension/test/lineedit.mjs
          node extension/test/smoke.mjs
          node extension/test/dwarf-client.mjs

      - name: 下载 vscode-web（约 200MB）
        run: node scripts/fetch-vscode-web.mjs

      - name: 生成中文 NLS
        run: node scripts/build-zh-nls.mjs

      - name: 打包静态站点（dist-cf + oi-web-cf.zip）
        run: node scripts/build-cf-dist.mjs

      - name: 上传构建产物（便于排查）
        uses: actions/upload-artifact@v4
        with:
          name: oi-web-cf
          path: oi-web-cf.zip
          retention-days: 7

      - name: 部署到 Cloudflare Pages
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler pages deploy dist-cf --project-name vscode --branch "${GITHUB_REF_NAME}"
